[package]
name = "blockchain"
version = "0.1.0"
edition = "2021"  # Alterado de 2024 para 2021 (padrão atual)

[dependencies]
# Adicionamos "serde" nas features aqui embaixo vvv
secp256k1 = { version = "0.28", features = ["rand", "recovery", "serde"] } 
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.0"
rand = "0.8"
hex = "0.4"
bincode = "1.3.3"
