[package]
name = "blockchain"
version = "0.1.0"
edition = "2024"

[dependencies]
secp256k1 = { version = "0.28", features = ["rand", "recovery"] }
chrono = { version = "0.4" , features = ["serde"] }                                        #biblioteca timestamp
serde = { version = "1.0.106", features = ["derive"] } #serialização
serde_json = "1.0"                                     #serialização
sha2 = "0.10.0"                                        #biblioteca de cálculo de hash
rand = "0.8"
hex = "0.4"
bincode = "1.3.3"
ripemd = "0.1"
base58 = "0.1.0"